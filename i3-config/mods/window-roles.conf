# for_window [window_role="About"] floating enable
for_window [class="^.*"] border normal 0
for_window [class="vlc"] floating enable

#for_window [class="app-menu"] border pixel 0
#for_window [class="app-menu"] floating enable
#for_window [class="app-menu"] fullscreen enable

for_window [class="(?i)floating"] border pixel 1, floating enable
for_window [class="(?i)dialog"] floating enable, border none

for_window [class="MEGAsync"] floating enable
for_window [class="MEGAsync" title="Adicionar sincronização"] floating disable
for_window [title="MEGAsync"] border none

for_window [class="steam" title="Lista de amigos"] floating enable
# for_window [title="- Discord"] move container to workspace $ws0
# for_window [class="whatsapp-desktop"] move container to workspace $ws0

# floating pop up automatically
for_window [window_role="pop-up"] floating enable border none
for_window [window_role="task_dialog"] floating enable border none

# move floating window to center
for_window [class="^(?!MEGAsync).*$"] move position center

client.focused #dbdbdb #dbdbdb #262626 #262626
client.focused_inactive #262626 #262626 #dbdbdb #dbdbdb
client.unfocused #555555 #555555 #dbdbdb #dbdbdb
client.urgent #ff9838 #ff9838 #262626 #262626
