mode "Resize" {
        # same bindings, but for the arrow keys
        bindsym Up resize shrink height 10 px or 10 ppt
        bindsym Down resize grow height 10 px or 10 ppt
        bindsym Left resize shrink width 10 px or 10 ppt
        bindsym Right resize grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+r
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+r mode "default"

}

mode "Move" {
        # same bindings, but for the arrow keys
        #bindsym Up move shrink height 10 px or 10 ppt
        #bindsym Down move grow height 10 px or 10 ppt
        #bindsym Left move shrink width 10 px or 10 ppt
        #bindsym Right move grow width 10 px or 10 ppt

        # back to normal: Enter or Escape or $mod+m
        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+m mode "default"

}

mode "Audio Card"{
        bindsym Left exec "bash ~/.config/polybar/modules/Audio-Card.bash -"
        bindsym Right exec "bash ~/.config/polybar/modules/Audio-Card.bash +"

        bindsym Return mode "default"
        bindsym Escape mode "default"
        bindsym $mod+u mode "default"
}

bindsym $mod+r mode "Resize"
bindsym $mod+m mode "Move"
bindsym $mod+u mode "Audio Card"
