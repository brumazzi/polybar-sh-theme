# volume key event
bindsym XF86AudioRaiseVolume exec "bash ~/.config/polybar/modules/Mixer.bash + 5"
bindsym XF86AudioLowerVolume exec "bash ~/.config/polybar/modules/Mixer.bash - 5"
bindsym $mod+plus exec "bash ~/.config/polybar/modules/Mixer.bash + 5"
bindsym $mod+minus exec "bash ~/.config/polybar/modules/Mixer.bash - 5"

# media player
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# screen capture
bindsym Print exec "bash ~/.config/polybar/modules/Record.bash --screenshot"
bindsym $mod+Print exec "bash ~/.config/polybar/modules/Record.bash --screenshot --window"
bindsym $mod+F12 exec "bash ~/.config/polybar/modules/Record.bash --toggle-record"
bindsym $mod+Shift+F12 exec "bash ~/.config/polybar/modules/Record.bash --toggle-record --window"
#bindsym $mod+Print exec --no-startup-id gnome-screenshot -i
